name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "db"
database_id = "8e474621-6db9-4544-8800-911f5063dec2"

[[kv_namespaces]]
binding = "kv"
id = "25f76df8d80d4224bb898ddebac20e31"

[[r2_buckets]]
binding = "r2"
bucket_name = "r2-mail"

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *", "0 16 * * *"]	#每5分钟重试发件任务，每天刷新分析缓存


[vars]
# Configure these as encrypted Worker secrets, not plain-text vars:
# resend_webhook_secret_polyurea = "" # turean-polyurea.com Resend account (whsec_...)
# resend_webhook_secret_coating = ""  # turean-coating.com Resend account (whsec_...)
# resend_webhook_secret = ""          # legacy single-account fallback
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
